<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>BACKROOMS</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:monospace;}
  #c{display:block;width:100vw;height:100vh;cursor:crosshair;}
  #minimap{position:fixed;top:10px;right:10px;z-index:6;image-rendering:pixelated;display:none;}
  #hud{position:fixed;top:10px;left:10px;color:#c9b458;text-shadow:0 0 6px #000;user-select:none;font-size:14px;z-index:4;}
  #hint{position:fixed;left:50%;top:60%;transform:translateX(-50%);color:#d6c66a;text-shadow:0 0 8px #000;z-index:6;user-select:none;font-size:18px;}
  #pause{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
         background:rgba(0,0,0,.55);color:#e8dc7a;font-family:monospace;font-size:52px;letter-spacing:10px;
         text-shadow:0 0 18px #000;z-index:8;user-select:none;cursor:pointer;}
  #pause small{font-size:16px;letter-spacing:2px;color:#b9ad5e;margin-top:14px;}
  #stamWrap{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);width:260px;height:14px;
            background:rgba(0,0,0,.55);border:1px solid #b6a94e;border-radius:3px;z-index:6;
            box-shadow:0 0 10px rgba(0,0,0,.6);overflow:hidden;}
  #stamFill{height:100%;width:100%;background:linear-gradient(90deg,#8fbf4a,#d8cf6a);transition:background .2s;}
  #stamWrap.empty #stamFill{background:linear-gradient(90deg,#8a3020,#c04a2a);}
  #win{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
       background:radial-gradient(circle at center, rgba(60,50,0,.55), rgba(0,0,0,.85));color:#ffe98a;
       font-family:monospace;font-size:64px;letter-spacing:14px;text-shadow:0 0 24px #ffb545,0 0 60px #ff8a00;
       z-index:9;user-select:none;}
  #win small{font-size:17px;letter-spacing:3px;color:#e0cf7a;margin-top:18px;text-shadow:0 0 10px #000;}
  #caught{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
       background:radial-gradient(circle at center, rgba(90,0,0,.6), rgba(0,0,0,.92));color:#ff5b4a;
       font-family:monospace;font-size:58px;letter-spacing:10px;text-shadow:0 0 26px #ff2a00,0 0 70px #a00;
       z-index:10;user-select:none;}
  #caught small{font-size:17px;letter-spacing:3px;color:#e6b0a2;margin-top:18px;text-shadow:0 0 10px #000;}
  #arrow{position:fixed;left:50%;top:56%;transform:translate(-50%,-50%);transform-origin:50% 50%;
         z-index:7;display:none;pointer-events:none;opacity:0;transition:opacity .35s;}
  #arrow i{display:block;width:0;height:0;margin:2px auto;
           border-left:40px solid transparent;border-right:40px solid transparent;
           border-bottom:52px solid #b9ff5e;filter:drop-shadow(0 0 12px #63b32a);}
  #arrow i:nth-child(2){opacity:.75;transform:scale(.85);}
  #arrow i:nth-child(3){opacity:.5;transform:scale(.7);}
  #flick{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5;}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.45) 100%);}
  /* napisy jak na VHS */
  #vhs{position:fixed;inset:0;pointer-events:none;z-index:7;font-family:"Consolas",monospace;color:#f2f2f2;text-shadow:0 0 6px rgba(255,255,255,.55), 0 0 2px rgba(255,255,255,.9);}
  #vhs .tl{position:absolute;top:16px;left:22px;font-size:26px;letter-spacing:3px;opacity:.9;}
  #vhs .tr{position:absolute;top:16px;right:22px;font-size:26px;letter-spacing:3px;opacity:.9;}
  #vhs .bl{position:absolute;bottom:18px;left:22px;font-size:26px;letter-spacing:3px;opacity:.9;}
  #vhs .br{position:absolute;bottom:18px;right:22px;font-size:24px;letter-spacing:2px;opacity:.9;}
  #rec{color:#ff3b30;animation:blink 1.6s steps(1,end) infinite;}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.15}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="vhs">
  <div class="tl" id="status">&#9654; PLAY</div>
  <div class="tr"><span id="rec">&#9679;</span> REC</div>
  <div class="bl">SP</div>
  <div class="br"><span id="ts">00:00:00</span></div>
</div>
  <div id="flick" style="display:none"></div>
<div id="hud">WASD — chodzenie | Mysz — rozglądanie | SHIFT — bieg | R — nowy świat | ESC — pauza</div>
<div id="stamWrap"><div id="stamFill"></div></div>
<div id="hint">Kliknij, aby przejąć mysz</div>
<div id="arrow"><i></i><i></i><i></i></div>
<div id="pause"><div>PAUZA</div><small>kliknij albo ESC, żeby wrócić</small></div>
<div id="win"><div>WYGRANA</div><small>dotarłeś na szczyt schodów — naciśnij R, aby zagrać ponownie</small></div>
<div id="caught"><div>SHREK CIĘ DORWAŁ</div><small>naciśnij R, aby zagrać ponownie</small></div>
<script src="textures.js"></script>
<script>
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2');
if(!gl){ document.body.innerHTML = '<div style="color:#d6c66a;font:24px monospace;padding:40px">Brak WebGL2 — zaktualizuj przeglądarkę.</div>'; }
else main();

function main(){
var fboReady = false;
const hud = document.getElementById('hud'), hint = document.getElementById('hint');
window.onerror = (m,s,l,c)=>{ document.body.innerHTML='<div style="color:#ff6666;background:#000;font:16px monospace;padding:30px;white-space:pre-wrap;z-index:99">BLAD JS: '+m+' (linia '+l+':'+c+')</div>'; };

// ===== NAPISY JAK NA VHS =====
const tsEl = document.getElementById('ts');
const stEl = document.getElementById('status');
const t0 = performance.now();
setInterval(()=>{
  const s = Math.floor((performance.now()-t0)/1000);
  const p = n => String(n).padStart(2,'0');
  tsEl.textContent = p(Math.floor(s/3600))+':'+p(Math.floor(s/60)%60)+':'+p(s%60);
}, 500);

// ===== ŚWIAT: NIESKOŃCZONA GENERACJA (1=ściana, 0=pusto) =====
const MS = 2048;                      // bufor świata (komórek) wokół gracza
const SLOT = 9;                       // siatka "slotów" pokoi
const HMAX = 0.80;                    // maksymalna wysokość bloku (jak w shaderze)
const STEP_H = 0.13;                  // wysokość jednego stopnia
const NSTEPS = 5;                     // liczba stopni (razem 0.65)
const TOP_H  = STEP_H*NSTEPS;         // wysokość szczytu schodów = wygrana
const hByte  = h => Math.max(0, Math.min(255, Math.round(h/HMAX*255)));
let map = new Uint8Array(MS*MS).fill(1);
let heights = new Uint8Array(MS*MS);  // 0 = brak bloku, >0 = wysokość (bajt)
const at = (x,y)=> (x<0||y<0||x>=MS||y>=MS) ? 1 : map[y*MS+x];

// LOSOWY SEED — za każdą grą inny układ (a w obrębie gry spójny)
let SEED = (Math.random()*0x7fffffff)|0;

// deterministyczny hash dla danego slotu (świat zawsze taki sam dla danego seeda)
function h2(i,j,s){
  let h = Math.imul(i|0, 374761393) + Math.imul(j|0, 668265263)
        + Math.imul(s|0, 1442695041) + Math.imul(SEED, 2246822519);
  h = Math.imul(h ^ (h>>>13), 1274126177);
  return ((h ^ (h>>>16)) >>> 0) / 4294967296;
}
function roomOf(i,j){
  const ex = h2(i,j,7) > 0.12;
  const w = 4 + Math.floor(h2(i,j,11)*5);
  const h = 4 + Math.floor(h2(i,j,13)*5);
  const ox = 1 + Math.floor(h2(i,j,17)*Math.max(1, SLOT-2-w));
  const oy = 1 + Math.floor(h2(i,j,19)*Math.max(1, SLOT-2-h));
  return { ex, x:i*SLOT+ox, y:j*SLOT+oy, w, h, cx:i*SLOT+ox+(w>>1), cy:j*SLOT+oy+(h>>1) };
}

// pozycja gracza — potrzebna generatorowi, żeby nie stawiał ścian na graczu
const playerPos = {x: MS/2, y: MS/2};

// prostokąt "brudny" do podmiany fragmentu tekstury
let dirty = null;
function markDirty(x,y){
  if(!dirty) dirty = {x0:x,y0:y,x1:x,y1:y};
  else { if(x<dirty.x0)dirty.x0=x; if(y<dirty.y0)dirty.y0=y; if(x>dirty.x1)dirty.x1=x; if(y>dirty.y1)dirty.y1=y; }
}
function carve(x,y){
  if(x<1||y<1||x>=MS-1||y>=MS-1) return;
  const i=y*MS+x;
  if(map[i]===0) return;
  map[i]=0; markDirty(x,y);
}
function corridorH(a,b){
  if(!a.ex||!b.ex) return;
  let y = a.cy + Math.floor(h2(a.cx,b.cy,23)*Math.max(1, (a.h-2)));
  y = Math.max(Math.min(a.y,b.y), Math.min(y, Math.max(a.y+a.h,b.y+b.h)-2));
  const x0 = Math.min(a.cx,b.cx), x1 = Math.max(a.cx,b.cx);
  for(let x=x0-1;x<=x1+1;x++){ carve(x,y); carve(x,y+1); }
}
function corridorV(a,b){
  if(!a.ex||!b.ex) return;
  let x = a.cx + Math.floor(h2(a.cx,b.cy,29)*Math.max(1, (a.w-2)));
  x = Math.max(Math.min(a.x,b.x), Math.min(x, Math.max(a.x+a.w,b.x+b.w)-2));
  const y0 = Math.min(a.cy,b.cy), y1 = Math.max(a.cy,b.cy);
  for(let y=y0-1;y<=y1+1;y++){ carve(x,y); carve(x+1,y); }
}

// lista znanych schodów (do strzałek) — trzymamy tylko kilka najbliższych
const stairsList = [];
// stawia schody 3D w pokoju (zawsze W ŚRODKU pokoju, nigdy w ścianie)
function placeStairs(r){
  if(!r.ex || r.w < NSTEPS+2 || r.h < 4) return false;
  // dopasuj pozycję tak, by całe schody (stopnie + platforma) były w pokoju
  let sx0 = r.x + 1;
  const maxX = r.x + r.w - (NSTEPS+2);          // ostatnia komórka stopni w pokoju
  if(sx0 > maxX) sx0 = maxX;
  let sy0 = r.y + 1 + Math.floor(h2(r.cx,r.cy,67)*Math.max(1, r.h-4));
  const maxY = r.y + r.h - 3;                   // 2 komórki szerokości + margines
  if(sy0 > maxY) sy0 = maxY;
  if(sx0 < r.x || sy0 < r.y) return false;
  const cxT = sx0 + NSTEPS, cyT = sy0;
  if(Math.hypot(cxT - playerPos.x, cyT - playerPos.y) < 4.0) return false;
  // nie stawiaj drugi raz w tym samym miejscu
  for(const s of stairsList){ if(Math.abs(s.x-cxT)<3 && Math.abs(s.y-cyT)<3) return true; }
  // najpierw wyczyść teren stopni (żeby nie nachodziły na ściany pokoju)
  for(let s=-1;s<=NSTEPS+1;s++){
    for(let dz=-1;dz<=2;dz++){
      const cx2 = sx0+s, cy2 = sy0+dz;
      if(cx2<1||cy2<1||cx2>=MS-1||cy2>=MS-1) continue;
      if(cx2 < r.x || cx2 >= r.x+r.w || cy2 < r.y || cy2 >= r.y+r.h) continue;
      map[cy2*MS+cx2]=0; heights[cy2*MS+cx2]=0; markDirty(cx2,cy2);
    }
  }
  const hTop = hByte(TOP_H);
  for(let s=0;s<NSTEPS;s++){
    const hh = hByte(STEP_H*(s+1));
    for(let dz=0;dz<2;dz++){
      const cx2 = sx0+s, cy2 = sy0+dz;
      map[cy2*MS+cx2]=1; heights[cy2*MS+cx2]=hh; markDirty(cx2,cy2);
    }
  }
  // platforma na szczycie
  for(let dz=0;dz<2;dz++){
    const cx2 = sx0+NSTEPS, cy2 = sy0+dz;
    map[cy2*MS+cx2]=1; heights[cy2*MS+cx2]=hTop; markDirty(cx2,cy2);
  }
  stairsList.push({x: sx0+0.5, y: sy0+1.0});
  if(stairsList.length > 24) stairsList.shift();
  return true;
}

const madeSlots = new Set();
function genSlot(i,j){
  const key = i*100000 + j;
  if(madeSlots.has(key)) return;
  madeSlots.add(key);
  const r = roomOf(i,j);
  if(r.ex){
    for(let y=r.y;y<r.y+r.h;y++) for(let x=r.x;x<r.x+r.w;x++) carve(x,y);
    // otwory w ścianach pokoju (dodatkowe przejścia)
    if(h2(i,j,31) < 0.55){ const oy = r.y + 1 + Math.floor(h2(i,j,37)*Math.max(1,r.h-2)); carve(r.x+r.w, oy); carve(r.x+r.w, oy+1); }
    if(h2(i,j,41) < 0.55){ const ox = r.x + 1 + Math.floor(h2(i,j,43)*Math.max(1,r.w-2)); carve(ox, r.y+r.h); carve(ox+1, r.y+r.h); }
    // filar w dużym pokoju (nigdy tam, gdzie stoi gracz)
    if(r.w>=6 && r.h>=6 && h2(i,j,47) < 0.5){
      const dp = Math.hypot(r.cx - playerPos.x, r.cy - playerPos.y);
      if(dp > 2.0){ map[r.cy*MS+r.cx]=1; markDirty(r.cx,r.cy); }
    }
    // RZADKIE SCHODY (3D) — prowadzą do wygranej. ~4% pokoi.
    if(h2(i,j,61) < 0.04) placeStairs(r);
  }
  if(r.ex){
    corridorH(r, roomOf(i+1,j));
    if(h2(i,j,53) < 0.35) corridorH(r, roomOf(i+2,j));
    corridorV(r, roomOf(i,j+1));
  }
}

// generuje sloty wokół gracza DUŻO wcześniej niż gracz dojdzie —
// dzięki temu żadna widoczna ściana nie znika mu przed nosem
const VIEW_AHEAD = 16;                // slotów w każdą stronę (~144 komórki > zasięg wzroku 128)
let lastSlotKey = '';
function ensureWorld(px,py){
  const ci = Math.floor(px/SLOT), cj = Math.floor(py/SLOT);
  const key = ci+'_'+cj;
  if(key === lastSlotKey) return false;
  lastSlotKey = key;
  const R = VIEW_AHEAD;
  for(let j=cj-R;j<=cj+R;j++) for(let i=ci-R;i<=ci+R;i++) genSlot(i,j);
  // Gwarancja: jeśli w pobliżu nie ma żadnych schodów, postaw jedne w okolicy
  let near = false;
  for(const s of stairsList){ if(Math.hypot(s.x-px, s.y-py) < 70){ near = true; break; } }
  if(!near){
    let placed = false;
    for(let rr=2; rr<=8 && !placed; rr++){
      for(let j=cj-rr;j<=cj+rr && !placed;j++){
        for(let i=ci-rr;i<=ci+rr && !placed;i++){
          if(Math.max(Math.abs(i-ci),Math.abs(j-cj)) !== rr) continue;
          if(placeStairs(roomOf(i,j))) placed = true;
        }
      }
    }
  }
  return true;
}

// start gracza: wolne pole w okolicy środka
let spawn = {x:MS/2+0.5, y:MS/2+0.5};
{
  const ci = Math.floor(spawn.x/SLOT), cj = Math.floor(spawn.y/SLOT);
  for(let j=cj-VIEW_AHEAD;j<=cj+VIEW_AHEAD;j++) for(let i=ci-VIEW_AHEAD;i<=ci+VIEW_AHEAD;i++) genSlot(i,j);
  let best=null, bd=1e9;
  for(let y=cj*SLOT-8;y<cj*SLOT+8;y++) for(let x=ci*SLOT-8;x<ci*SLOT+8;x++){
    if(at(x,y)===0 && at(x+1,y)===0 && at(x,y+1)===0){
      const d=(x-spawn.x)*(x-spawn.x)+(y-spawn.y)*(y-spawn.y);
      if(d<bd){ bd=d; best={x:x+0.5,y:y+0.5}; }
    }
  }
  if(best) spawn = best;
}
// "solid" = pełna ściana (blok o wysokości można pokonać wchodząc po stopniach)
const solid = (x,y)=>{
  const cx = x|0, cy = y|0;
  if(cx<0||cy<0||cx>=MS||cy>=MS) return true;
  const i = cy*MS+cx;
  return map[i]===1 && heights[i]===0;
};

// ===== GL =====
const RSCALE = 0.7;   // scena renderowana w 70% rozdzielczości (dużo szybciej, VHS i tak rozmywa)
cv.width = Math.max(2,Math.floor(innerWidth*RSCALE)); cv.height = Math.max(2,Math.floor(innerHeight*RSCALE));
function rs(){ cv.width = Math.max(2,Math.floor(innerWidth*RSCALE)); cv.height = Math.max(2,Math.floor(innerHeight*RSCALE)); gl.viewport(0,0,cv.width,cv.height); if(fboReady) resizeSceneTex(); }
addEventListener('resize', rs); rs();

const VS = `#version 300 es
layout(location=0) in vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }`;

const FS = `#version 300 es
precision highp float;
out vec4 O;
uniform sampler2D uMap;
uniform sampler2D uWallTex, uFloorTex, uCeilTex;
uniform sampler2D uSprite;
uniform int uHasTex;
uniform vec2 uWallRep, uFloorRep, uCeilRep;
uniform vec3 uEnemy;          // pozycja Shreka (x, y-wysokość podstawy, z)
uniform vec2 uEnemySize;      // (połowa szerokości, wysokość)
uniform float uHasEnemy;
uniform vec2 uRes, uPos;
uniform vec2 uDir;
uniform float uTime, uPitch, uEye, uStairShow;
uniform vec2 uStairDir;
const float TANH = 0.57735;   // FOV 60°
const float WC = 1.35;        // wysokość sufitu
const float MS = 2048.0;      // rozmiar bufora świata (musi się zgadzać z JS)
const float HMAX = 0.80;      // maksymalna wysokość bloku (schodów)

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float vnoise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+1.0),f.x), f.y);
}

// tapeta Backrooms — słynny żółty wzór: kolumny strzałek '^' (Level 0)
float aa(float d){ // antyaliasowana krawędź wzoru
  return clamp(0.5 - d, 0., 1.);
}
// ---- TAPETA (Level 0): gęste kolumny zagnieżdżonych chevronów '^^' ----
float wallPattern(vec2 uv){
  float u = uv.x;                          // współrzędna świata
  float v = clamp(uv.y, 0., 1.);
  float nu = 8.0;                          // kolumny (gęsto, jak na zdjęciu)
  float nv = 12.0;                         // chevrony na wysokość ściany
  float colf = u*nu;
  float fu = fract(colf);
  float fv = fract(v*nv);
  // zagnieżdżone chevrony '^' (dwa poziomy, puste w środku)
  float slope = 1.15;
  float d  = abs(fv-0.5) - (0.5-abs(fu-0.5))*slope;
  float c1 = clamp(aa(abs(d)-0.135) - aa(abs(d)-0.058), 0., 1.);
  float d2 = abs(fv-0.5) - (0.5-abs(fu-0.5))*slope*0.52;
  float c2 = clamp(aa(abs(d2)-0.055) - aa(abs(d2)-0.024), 0., 1.)*0.75;
  float chev = max(c1, c2);
  // pionowy słupek przez środek kolumny
  float stem = aa(abs(fu-0.5)-0.020)*0.7;
  // cienkie pionowe linie na krawędziach kolumn
  float edge = aa(abs(fu-0.5)-0.474)*0.45;
  return clamp(chev + stem + edge, 0., 1.);
}

vec3 wallTex(vec2 uv, float side){
  float u = uv.x;
  float v = clamp(uv.y, 0., 1.);
  vec3 base = vec3(0.80,0.76,0.38);        // żółty #CCC35E (jasna tapeta)
  vec3 ink  = vec3(0.66,0.63,0.29);        // wzór tylko trochę ciemniejszy (zbliżone kolory)
  float pat = wallPattern(uv);
  vec3 c = mix(base, ink, pat*0.75);
  // drobna faktura papieru
  c *= 0.994 + 0.006*vnoise(vec2(u*160.0, v*90.0));
  // lekki relief wzoru (światłocień w druku)
  c *= 1.0 + (pat-0.5)*0.05;
  // biały cokół przy podłodze
  c = mix(c, vec3(0.91,0.91,0.86), smoothstep(0.078,0.060,v));
  return c * mix(1.0, 0.90, side);
}

// bump mapping: delikatny relief wzoru tapety (płaski, matowy nadruk)
vec3 wallNormal(vec2 uv, vec3 N, vec3 T, vec3 B){
  float e = 0.0025;
  float h  = wallPattern(uv);
  float hu = wallPattern(uv + vec2(e,0.));
  float hv = wallPattern(uv + vec2(0.,e));
  float k  = 0.0006;
  return normalize(N - T*((hu-h)/e)*k - B*((hv-h)/e)*k);
}

// ---- PODŁOGA: brązowa, cętkowana wykładzina (jak na zdjęciu) ----
vec3 floorTex(vec2 p, float t){
  // wielkie, miękkie łaty + średnie i drobne cętki
  float b1 = vnoise(p*0.85);
  float b2 = vnoise(p*2.6);
  float b3 = vnoise(p*7.0);
  float b4 = vnoise(p*18.0);
  float blotch = b1*0.45 + b2*0.30 + b3*0.15 + b4*0.10;
  float m = smoothstep(0.30,0.68, blotch);
  vec3 cLight = vec3(0.55,0.42,0.18);   // ochra/piaskowy brąz
  vec3 cMid   = vec3(0.34,0.24,0.10);
  vec3 cDark  = vec3(0.15,0.09,0.04);   // ciemny brąz
  vec3 c = m<0.5 ? mix(cLight,cMid, m*2.0) : mix(cMid,cDark,(m-0.5)*2.0);
  // ziarno włókien (wygasza się z odległością)
  float det = clamp(1.0 - t*0.10, 0.0, 1.0);
  float fib = vnoise(p*45.0)*0.5 + hash(floor(p*34.0))*0.5;
  c *= 0.90 + 0.22*fib*det;
  return c;
}

// bump wykładziny — delikatny relief włókien
vec3 floorNormal(vec2 p, float t){
  float det = clamp(1.0 - t*0.20, 0.0, 1.0);
  if(det <= 0.001) return vec3(0.,1.,0.);
  float e = 0.03;
  float h  = vnoise(p*38.0);
  float hx = vnoise((p+vec2(e,0.))*38.0);
  float hy = vnoise((p+vec2(0.,e))*38.0);
  float k = 0.004*det;
  return normalize(vec3(0.,1.,0.) - vec3((hx-h)/e, 0., (hy-h)/e)*k);
}
// bardzo delikatne zaciemnienie podłogi przy ścianach (kontaktowy cień)
float floorAO(vec2 p){
  float w = 0.0;
  w += texelFetch(uMap, ivec2(int(p.x+0.34),int(p.y)),0).r;
  w += texelFetch(uMap, ivec2(int(p.x-0.34),int(p.y)),0).r;
  w += texelFetch(uMap, ivec2(int(p.x),int(p.y+0.34)),0).r;
  w += texelFetch(uMap, ivec2(int(p.x),int(p.y-0.34)),0).r;
  return 1.0 - clamp(w*0.028, 0., 0.11);
}

vec3 ceilTex(vec2 p){
  // SZARE płyty sufitowe z wyraźnymi szczelinami
  vec2 f = fract(p);
  vec2 e = min(f, 1.0-f);
  float line = 1.0 - smoothstep(0.015,0.040, min(e.x,e.y));
  vec3 c = vec3(0.60,0.60,0.585)*(0.96+0.04*vnoise(p*18.0));
  return c*mix(1.0,0.55,line);
}

bool isLightCell(vec2 c){ return mod(c.x,2.)==0. && mod(c.y,2.)==0.; }

// oświetlenie — INNE dla każdego materiału (mat: 0=podłoga, 1=sufit, 2=ściana)
vec3 lit(vec3 P, vec3 N, vec3 viewDir, int mat){
  vec3 sum = vec3(0.);
  vec2 base = floor((P.xz-0.5)/2.0);
  for(int i=-1;i<=1;i++) for(int j=-1;j<=1;j++){
    vec2 id = base+vec2(i,j);
    if(mod(id.x,2.)!=0.||mod(id.y,2.)!=0.) continue;
    vec3 L = vec3(id.x*2.0+0.5, WC-0.04, id.y*2.0+0.5);
    if(L.x<0.5||L.z<0.5||L.x>float(MS)-0.5||L.z>float(MS)-0.5) continue;
    // lampa świeci tylko, jeśli pod nią jest korytarz/pokój
    float on = texelFetch(uMap, ivec2(int(L.x),int(L.z)),0).r>0.5 ? 0.0:1.0;
    vec3 toL = L-P; float d2 = dot(toL,toL)+0.02;
    vec3 Ldir = toL*inversesqrt(d2);
    float ndl = clamp(dot(Ldir,N),0.,1.);
    float att = 1.0/(0.6+d2*3.0);
    float diff = ndl;
    float spec = 0.0;

    if(mat==2){
      // ŚCIANA: jednolite światło na CAŁEJ wysokości (liczone w połowie wysokości,
      // żeby dół ściany był identyczny jak góra)
      vec3 Pm = vec3(P.x, WC*0.5, P.z);
      vec3 toLm = L - Pm;
      float d2m = dot(toLm,toLm) + 0.02;
      vec3 Ldirm = toLm*inversesqrt(d2m);
      att = 1.0/(0.6 + d2m*3.0);
      diff = clamp(dot(Ldirm,N),0.,1.)*0.9 + 0.10;
      spec = pow(clamp(dot(reflect(viewDir,Ldirm),viewDir),0.,1.),28.0)*0.03;
    } else if(mat==0){
      // PODŁOGA: wykładzina — miękkie światło + aksamitny odblask (velvet)
      float wrap = clamp((dot(Ldir,N)+0.40)/1.40, 0., 1.);
      float velvet = pow(1.0-clamp(dot(N,viewDir),0.,1.), 2.0);
      att *= 0.80;
      diff = wrap*0.85 + 0.15;
      spec = velvet*0.02;                 // kafle — matowe
    } else {
      // SUFIT: płyty — prawie jednolite, płaskie rozproszenie
      diff = ndl*0.55 + 0.45;
    }
    sum += vec3(1.0,0.94,0.75)*1.35*on*att*diff + spec*on;
  }
  // własny ambient dla każdego materiału
  if(mat==2) return sum + vec3(0.22,0.21,0.14);
  if(mat==0) return sum + vec3(0.16,0.15,0.10);
  return sum + vec3(0.20,0.19,0.14);
}
// świetlówka sufitowa: wpuszczony troffer (jasna płyta + szara obudowa)
vec3 emitter(vec2 p, vec2 cellId){
  vec2 l = fract(p);
  bool lampCell = mod(cellId.x,2.)==0. && mod(cellId.y,2.)==0.;
  if(!lampCell) return vec3(0.);
  // obudowa troffera (bezel)
  bool housing = l.x>0.05 && l.x<0.95 && l.y>0.16 && l.y<0.84;
  if(!housing) return vec3(0.);
  // świecąca płyta — jasny biały
  bool panel = l.x>0.09 && l.x<0.91 && l.y>0.21 && l.y<0.79;
  if(panel) return vec3(1.0,0.99,0.95)*2.6;
  // szara obudowa rozświetlona od dołu
  return vec3(0.58,0.58,0.56)*1.02;
}

// strzałka MALOWANA NA PODŁODZE — prowadzi do schodów (okresowo widoczna)
float floorArrow(vec2 wp){
  if(uStairShow < 0.01) return 0.0;
  vec2 cellId = floor(wp);
  vec2 rel = cellId - floor(uPos);
  float dist = length(rel);
  if(dist < 1.0 || dist > 13.0) return 0.0;
  if(mod(cellId.x*3.0 + cellId.y*7.0, 5.0) > 0.6) return 0.0;
  vec2 lq = fract(wp) - 0.5;
  vec2 d = uStairDir;
  vec2 rgt = vec2(-d.y, d.x);
  vec2 q = vec2(dot(lq, rgt), dot(lq, d));      // q.y = wzdłuż kierunku
  // grot (trójkąt)
  float tri = 0.0;
  if(q.y > 0.04 && q.y < 0.36){
    float t = (0.36 - q.y)/0.32;
    float hw = t*0.20;
    tri = 1.0 - smoothstep(hw-0.025, hw+0.025, abs(q.x));
  }
  // ogon
  float st = 0.0;
  {
    float w = 0.075;
    float a = 1.0 - smoothstep(w-0.02, w+0.02, abs(q.x));
    float b = smoothstep(-0.36,-0.30,q.y)*(1.0-smoothstep(0.02,0.08,q.y));
    st = a*b;
  }
  float shape = clamp(max(tri, st), 0.0, 1.0);
  return shape * uStairShow * (1.0 - dist/13.0);
}

void main(){
  vec2 uv = vec2( (gl_FragCoord.x/uRes.x*2.0-1.0)*(uRes.x/uRes.y), gl_FragCoord.y/uRes.y*2.0-1.0 );
  vec2 dir = uDir;
  vec3 f = vec3(dir.x,0.,dir.y);
  vec3 r = vec3(-dir.y,0.,dir.x);
  vec3 up = vec3(0.,1.,0.);
  vec3 rd = normalize( f + r*uv.x*0.57735 + up*uv.y*0.57735 );
  // pitch — obrót wokół osi prawej
  float cp=cos(uPitch), sp=sin(uPitch);
  rd = rd*cp + cross(r,rd)*sp + r*dot(r,rd)*(1.-cp);
  rd = normalize(rd);

  // DDA 2D
  int mx=int(floor(uPos.x)), mz=int(floor(uPos.y));
  vec2 idx = 1.0/vec2(rd.x==0.?1e-6:rd.x, rd.z==0.?1e-6:rd.z);
  int sx = rd.x<0.?-1:1, sz = rd.z<0.?-1:1;
  float tdx = abs(idx.x), tdz = abs(idx.y);
  float sdx = (rd.x<0.? (uPos.x-float(mx)) : (float(mx)+1.-uPos.x))*(rd.x==0.?1e9:abs(1.0/rd.x));
  float sdz = (rd.z<0.? (uPos.y-float(mz)) : (float(mz)+1.-uPos.y))*(rd.z==0.?1e9:abs(1.0/rd.z));

  // --- DDA z obsługą BLOKÓW o zmiennej wysokości (schody) ---
  //  .r = ściana/blok,  .g = wysokość bloku
  float tW=1e9; int side=0; int hitK=0;  // 0=brak 1=pełna ściana 2=bok bloku 3=góra bloku
  float blockH = 0.0;                     // wysokość trafionego bloku
  float tTopHit = 1e9;                    // odległość do górnej płaszczyzny bloku
  for(int i=0;i<128;i++){
    float tEntry;
    if(sdx<sdz){ tEntry = sdx; sdx+=tdx; mx+=sx; side=0; }
    else       { tEntry = sdz; sdz+=tdz; mz+=sz; side=1; }
    vec4 cell = texelFetch(uMap, ivec2(mx,mz),0);
    if(cell.r > 0.5){
      float h = cell.g/255.0 * HMAX;
      if(h < 0.02){ tW = tEntry; hitK = 1; break; }        // pełna ściana
      float yE = uEye + rd.y*tEntry;
      if(yE < h){ tW = tEntry; hitK = 2; blockH = h; break; } // bok bloku
      // promień leci nad blokiem — sprawdź górną płaszczyznę w tej komórce
      if(rd.y < -1e-4){
        float tTop = (h - uEye)/rd.y;
        if(tTop > tEntry){
          vec3 Q = vec3(uPos.x,0.,uPos.y) + rd*tTop;
          if(int(floor(Q.x))==mx && int(floor(Q.z))==mz){
            tTopHit = tTop; hitK = 3; blockH = h; break;
          }
        }
      }
      // inaczej: przelatuje nad blokiem → lecimy dalej
    }
  }
  // płaszczyzny poziome
  float tF = rd.y<-1e-4 ? uEye/-rd.y : 1e9;
  float tC = rd.y> 1e-4 ? (WC-uEye)/rd.y : 1e9;

  float t; vec3 P; int kind; // 0=floor 1=ceil 2=wall 3=top bloku 4=bok bloku
  if(hitK==3 && tTopHit < tF && tTopHit < tC){ t=tTopHit; kind=3; }
  else if(tF<tW && tF<=tC){ t=tF; kind=0; }
  else if(tC<tW){ t=tC; kind=1; }
  else { t=tW; kind = (hitK==2) ? 4 : 2; }
  t = max(t, 0.02);
  P = vec3(uPos.x,0.,uPos.y) + rd*t;

  vec3 albedo; vec3 N; vec3 glow = vec3(0.0);
  if(kind==0){
    if(uHasTex==1){
      albedo = texture(uFloorTex, P.xz*uFloorRep).rgb * floorAO(P.xz);
    } else {
      albedo = floorTex(P.xz, t) * floorAO(P.xz);
    }
    N = floorNormal(P.xz, t);
  }
  else if(kind==1){
    albedo = ceilTex(P.xz);                       // szary sufit (proceduralny)
    vec3 e = emitter(P.xz, floor(P.xz));
    if(dot(e,e)>0.01){
      O = vec4(e, 1.0);
      return;
    }
    N = vec3(0.,-1.,0.);
  }
  else if(kind==3){
    // GÓRNA PŁASZCZYZNA STOPNIA — ciepła, świecąca platforma (dobrze widoczna)
    vec3 base;
    if(uHasTex==1){
      base = texture(uFloorTex, P.xz*uFloorRep).rgb;
    } else {
      base = floorTex(P.xz, t);
    }
    vec2 fr = abs(fract(P.xz)-0.5);
    float edge = smoothstep(0.40,0.5, max(fr.x,fr.y));
    albedo = mix(base, vec3(0.62,0.47,0.20), 0.55) * (0.80 + 0.20*(1.0-edge));
    glow = vec3(0.34,0.23,0.06)*(1.0-edge);       // poświata — widać z daleka
    N = vec3(0.,1.,0.);
  }
  else if(kind==4){
    // BOK STOPNIA — ciemne drewno z listwami i świecącą krawędzią
    float y = clamp(P.y/max(blockH,0.05), 0., 1.);
    float planks = step(0.5, fract(P.y*8.0));
    vec3 wood = mix(vec3(0.26,0.17,0.08), vec3(0.37,0.25,0.12), planks);
    float grain = 0.92 + 0.08*vnoise(vec2((side==0?P.z:P.x)*40.0, P.y*12.0));
    albedo = wood*grain;
    glow = vec3(0.26,0.18,0.06)*smoothstep(0.82,1.0,y);   // świecąca górna krawędź
    N = side==0 ? vec3(rd.x>0.?-1.:1.,0,0) : vec3(0,0,rd.z>0.?-1.:1.);
  }
  else {
    float w = side==0 ? P.z : P.x;
    float y = P.y/WC;
    vec2 wuv = vec2(w, y) * uWallRep;
    vec3 Tw = side==0 ? vec3(0,0,1) : vec3(1,0,0);
    N = side==0 ? vec3(rd.x>0.?-1.:1.,0,0) : vec3(0,0,rd.z>0.?-1.:1.);
    if(uHasTex==1){
      vec3 wt = texture(uWallTex, wuv).rgb;
      // 1) kolory bardziej zbliżone do siebie (mniejszy kontrast barwy i jasności)
      float lw = dot(wt, vec3(0.299,0.587,0.114));
      wt = mix(wt, vec3(lw), 0.40);                 // wyrównanie barwy
      wt = mix(wt, vec3(0.74,0.70,0.34), 0.30);     // zbliżenie do średniego odcienia
      albedo = wt * mix(1.0, 0.93, float(side));
      // relief z luminancji prawdziwej tekstury
      float h0 = dot(texture(uWallTex, wuv).rgb, vec3(0.299,0.587,0.114));
      float hu = dot(textureOffset(uWallTex, wuv, ivec2(2,0)).rgb, vec3(0.299,0.587,0.114));
      float hv = dot(textureOffset(uWallTex, wuv, ivec2(0,2)).rgb, vec3(0.299,0.587,0.114));
      N = normalize(N - Tw*(hu-h0)*0.45 - vec3(0.,1.,0.)*(hv-h0)*0.45);
    } else {
      albedo = wallTex(vec2(w,y), side==1?1.:0.);
      albedo *= mix(0.82, 1.02, vnoise(P.xz*0.35));
      N = wallNormal(vec2(w,y), N, Tw, vec3(0,1,0));
    }
  }
  int mat = (kind==1) ? 1 : ((kind==0 || kind==3) ? 0 : 2);
  vec3 col = albedo * lit(P, N, rd, mat) + glow;

  // ===== SHREK (billboard 3D z okluzją przez ściany) =====
  if(uHasEnemy > 0.5){
    vec2 rel = uEnemy.xz - uPos;
    float depth = dot(rel, dir);
    if(depth > 0.12){
      float aspect = uRes.x/uRes.y;
      vec2 rdir = vec2(-dir.y, dir.x);
      float lateral = dot(rel, rdir);
      float su = (lateral/depth)/(0.57735*aspect);
      float sv = ((uEnemy.y + uEnemySize.y*0.5) - uEye)/depth/0.57735;
      float hw = (uEnemySize.x/depth)/(0.57735*aspect);
      float hh = (uEnemySize.y*0.5/depth)/0.57735;
      if(abs(uv.x-su) < hw && abs(uv.y-sv) < hh){
        vec2 tc = vec2((uv.x-su)/(2.0*hw)+0.5, 0.5+(uv.y-sv)/(2.0*hh));
        vec4 sp = texture(uSprite, tc);
        float denom = max(dot(rd, vec3(dir.x,0.,dir.y)), 1e-3);
        float tPlane = depth/denom;                 // odległość wzdłuż promienia
        if(sp.a > 0.35 && tPlane < t + 0.02){       // zasłaniany przez ściany
          vec3 eMid = vec3(uEnemy.x, uEnemy.y + uEnemySize.y*0.5, uEnemy.z);
          vec3 toCam = normalize(vec3(uPos.x,0.,uPos.y) - eMid);
          vec3 lgt = lit(eMid, toCam, rd, 2) + vec3(0.18,0.16,0.10);
          col = sp.rgb * lgt * 1.15;
          t = tPlane;
        }
      }
    }
  }
  // delikatne przygaszanie z odległością (bez mgły)
  col *= clamp(1.60 - t*0.032, 0.55, 1.60);
  // tone map
  col = 1.0 - exp(-col*1.75);
  // vignette + grain
  vec2 q = gl_FragCoord.xy/uRes;
  col *= 0.35+0.65*pow(16.0*q.x*q.y*(1.-q.x)*(1.-q.y),0.25);
  col += (hash(gl_FragCoord.xy + fract(uTime)*100.0)-0.5)*0.035;
  O = vec4(col,1.0);
}`;

// ===== SHADER VHS (post-processing) =====
const FS_POST = `#version 300 es
precision highp float;
out vec4 O;
uniform sampler2D uScene;
uniform vec2 uRes;
uniform float uTime;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float vnoise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+1.0),f.x), f.y);
}
void main(){
  vec2 uv = gl_FragCoord.xy/uRes;
  float t = uTime;

  // 1) lekkie falowanie taśmy (jitter per linia)
  float line = floor(gl_FragCoord.y);
  float jitter = (hash(vec2(line, floor(t*24.0)))-0.5) * 0.0016;
  // 2) pasek "tracking" przesuwający się w pionie (silne zaburzenie)
  float band = fract(uv.y*1.0 + t*0.13);
  float inBand = 1.0 - smoothstep(0.0, 0.035, abs(band-0.5));
  jitter += inBand * (hash(vec2(line, floor(t*30.0)))-0.5) * 0.010;
  // 3) globalne, rzadkie szarpnięcia taśmy
  float glitch = step(0.994, hash(vec2(floor(t*8.0), 3.1)));
  jitter += glitch * 0.012 * (hash(vec2(line, floor(t*60.0)))-0.5);

  vec2 duv = vec2(uv.x + jitter, uv.y);

  // 4) aberracja chromatyczna (RGB rozjechane w poziomie)
  float ca = 0.0016 + inBand*0.004 + glitch*0.004;
  float rC = texture(uScene, duv + vec2( ca, 0.0)).r;
  float gC = texture(uScene, duv).g;
  float bC = texture(uScene, duv - vec2( ca, 0.0)).b;
  vec3 col = vec3(rC, gC, bC);

  // 5) KOLOR JAK Z TAŚMY VHS:
  //    jasność ostra (jak luminancja), kolor rozmazany w poziomie (mała szerokość pasma chromy)
  vec3 cL = texture(uScene, duv - vec2(0.010,0.0)).rgb;
  vec3 cR = texture(uScene, duv + vec2(0.010,0.0)).rgb;
  const vec3 W = vec3(0.299,0.587,0.114);
  float y0 = dot(col, W);
  vec3 chroma = ((cL - dot(cL,W)) + (col - y0) + (cR - dot(cR,W))) / 3.0;
  col = vec3(y0) + chroma*1.35;                 // podbita, rozmazana barwa
  // ograniczona paleta taśmy (banding koloru)
  col = floor(col*24.0 + 0.5)/24.0;
  // lekki zafarb VHS (ciepłe żółcie + zielone cienie)
  col *= vec3(1.03, 1.00, 0.955);
  col += vec3(0.012, 0.010, 0.0)*(1.0-y0);

  // 6) rozmycie taśmy (poziomy "smear" jasnych miejsc)
  vec3 smear = texture(uScene, duv - vec2(0.006,0.0)).rgb
             + texture(uScene, duv - vec2(0.012,0.0)).rgb;
  col = mix(col, col*0.7 + smear*0.16, 0.35);

  // 6) scanlines (linie nośnych)
  float scan = 0.94 + 0.06*sin(uv.y*uRes.y*3.14159);
  col *= scan;
  // subtelne pionowe linie maski
  col *= 0.99 + 0.01*sin(uv.x*uRes.x*3.14159*0.5);

  // 7) rolling bar (jasny pas jadący po ekranie)
  float roll = fract(uv.y + t*0.10);
  col *= 1.0 + 0.05*(1.0 - smoothstep(0.0,0.25,abs(roll-0.5)));

  // 8) szum taśmy + drobny "dropout" (białe kropki)
  col += (hash(gl_FragCoord.xy + fract(t)*77.0)-0.5)*0.045;
  float drop = step(0.9995, hash(gl_FragCoord.xy + floor(t*20.0)));
  col += drop*0.5;

  // 9) lekka utrata koloru i podbicie kontrastu (jak VHS)
  float lum = dot(col, vec3(0.299,0.587,0.114));
  col = mix(col, vec3(lum), 0.15);
  col = clamp((col-0.5)*1.08 + 0.52, 0.0, 1.0);

  // 10) zanikanie brzegów (CRT) i przeplot linii
  vec2 q = uv*2.0-1.0;
  col *= 1.0 - 0.10*dot(q,q);
  O = vec4(col, 1.0);
}`;

// kompilacja
function shErr(msg){ document.body.innerHTML = '<div style="color:#ff6666;background:#000;font:16px monospace;padding:30px;white-space:pre-wrap;z-index:99">'+msg+'</div>'; }
function sh(type, src){
  const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) shErr('BLAD SHADERA: '+gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) shErr('BLAD LINKU: '+gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const U = {};

// podmiana tylko zmienionego prostokąta świata
function uploadWorldDirty(){
  if(!dirty) return;
  const x0 = Math.max(0,dirty.x0), y0 = Math.max(0,dirty.y0);
  const x1 = Math.min(MS-1,dirty.x1), y1 = Math.min(MS-1,dirty.y1);
  const w = x1-x0+1, h = y1-y0+1;
  if(w>0 && h>0){
    const buf = new Uint8Array(w*h*2);
    for(let y=0;y<h;y++){
      const row = (y0+y)*MS;
      for(let x=0;x<w;x++){
        const i = row+x0+x;
        buf[(y*w+x)*2]   = map[i] ? 255 : 0;
        buf[(y*w+x)*2+1] = heights[i];
      }
    }
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, mapTex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texSubImage2D(gl.TEXTURE_2D,0,x0,y0,w,h,gl.RG,gl.UNSIGNED_BYTE,buf);
  }
  dirty = null;
}
uploadWorldDirty();

let hasTex = 0;
function loadTex(url, unit){
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0+unit);
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([128,128,128,255]));
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.MIRRORED_REPEAT);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.MIRRORED_REPEAT);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  const im = new Image();
  im.onload = ()=>{
    gl.activeTexture(gl.TEXTURE0+unit);
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);

    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
  };
  im.src = url;

}

// ===== KOLIZJE (AABB gracza + małe kroki = brak przenikania przez ściany) =====
const PR = 0.27;                                  // promień gracza
const MAXSTEP = 0.19;                             // maks. różnica wysokości, na jaką wejdziemy
function canStand(x,y){
  return !solid(x-PR,y-PR) && !solid(x+PR,y-PR) &&
         !solid(x-PR,y+PR) && !solid(x+PR,y+PR);
}
// wysokość podłogi (bloków) pod danym punktem — najwyższy z próbkowanych
function groundAt(x,y){
  let g = 0;
  const P = PR*0.92;
  const pts = [[0,0],[-P,-P],[P,-P],[-P,P],[P,P]];
  for(const p of pts){
    const cx = Math.floor(x+p[0]), cy = Math.floor(y+p[1]);
    if(cx<0||cy<0||cx>=MS||cy>=MS) continue;
    const hv = heights[cy*MS+cx];
    if(hv>0){ const hh = hv/255*HMAX; if(hh>g) g = hh; }
  }
  return g;
}
function canGo(x,y,curG){
  if(!canStand(x,y)) return false;
  return groundAt(x,y) <= curG + MAXSTEP;
}
function movePlayer(dx,dy){
  const dist = Math.hypot(dx,dy);
  if(dist < 1e-6) return;
  const ox = pX, oy = pY;
  const steps = Math.max(1, Math.ceil(dist/0.10));   // dzielimy ruch na małe kroki
  const sx = dx/steps, sy = dy/steps;
  for(let i=0;i<steps;i++){
    const g = groundAt(pX,pY);
    if(canGo(pX+sx, pY+sy, g)){ pX+=sx; pY+=sy; }
    else if(canGo(pX+sx, pY, g)){ pX+=sx; }          // ślizganie po ścianie
    else if(canGo(pX, pY+sy, g)){ pY+=sy; }
    else break;
  }
  // zabezpieczenie: nigdy nie kończymy wewnątrz ściany
  if(!canStand(pX,pY)){ pX = ox; pY = oy; }
  pX = Math.min(MS-2, Math.max(1, pX));
  pY = Math.min(MS-2, Math.max(1, pY));
}

function makeShrekSprite(){

  const E = (x,y,rx,ry,col)=>{ g.fillStyle=col; g.beginPath(); g.ellipse(x,y,rx,ry,0,0,Math.PI*2); g.fill(); };
  const SKIN='#7fae4b', SKIN_D='#6d9a3f', VEST='#6b4a24', VEST_D='#553a1c', WHITE='#f2f0e6';
  // nogi (brązowe spodnie)
  g.fillStyle='#4a3418'; g.fillRect(84,360,36,150); g.fillRect(136,360,36,150);
  // buty
  g.fillStyle='#2b1f10'; g.fillRect(76,486,52,26); g.fillRect(128,486,52,26);
  // tułów (zielony) + kamizelka
  g.fillStyle=SKIN; g.beginPath(); g.ellipse(128,300,74,104,0,0,Math.PI*2); g.fill();
  g.fillStyle=VEST; g.beginPath(); g.ellipse(128,300,62,96,0,0,Math.PI*2); g.fill();
  g.fillStyle=VEST_D; g.fillRect(122,214,12,180);
  // ramiona
  g.fillStyle=SKIN_D; g.beginPath(); g.ellipse(52,290,26,84,0.18,0,Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(204,290,26,84,-0.18,0,Math.PI*2); g.fill();
  // uszy (trąbki)
  E(60,150,20,15,SKIN_D); E(196,150,20,15,SKIN_D);
  // głowa
  E(128,168,74,80,SKIN);
  E(128,196,66,54,SKIN);       // policzki
  // brwi
  g.strokeStyle='#3a2a12'; g.lineWidth=9; g.lineCap='round';
  g.beginPath(); g.moveTo(88,132); g.lineTo(118,138); g.moveTo(168,132); g.lineTo(138,138); g.stroke();
  // oczy
  E(104,158,17,20,WHITE); E(152,158,17,20,WHITE);
  E(104,160,8,10,'#1b1408'); E(152,160,8,10,'#1b1408');
  // nos
  E(128,188,12,9,SKIN_D);
  // usta
  g.fillStyle='#3a1f14'; g.beginPath(); g.ellipse(128,216,36,14,0,0,Math.PI*2); g.fill();
  g.fillStyle='#c9b18c'; g.fillRect(96,208,64,6);
  return c;
}

// znajduje wolne pole w podanej odległości od gracza i tam stawia Shreka
function spawnEnemy(minD, maxD){
  for(let tries=0; tries<400; tries++){
    const a = Math.random()*Math.PI*2;
    const d = minD + Math.random()*(maxD-minD);
    const x = pX + Math.cos(a)*d, y = pY + Math.sin(a)*d;
    if(x<2||y<2||x>=MS-2||y>=MS-2) continue;
    if(at(x|0,y|0)===0 && at((x|0)+1,y|0)===0 && at(x|0,(y|0)+1)===0){
      enemy = {x:x, y:y};
      return;
    }
  }
  enemy = null;
}

// ruch Shreka w stronę gracza (ślizga się po ścianach)
function moveEnemy(dt){
  if(!enemy) return;
  const spd = 2.05*dt;
  let dx = pX-enemy.x, dy = pY-enemy.y;
  const l = Math.hypot(dx,dy) || 1;
  dx/=l; dy/=l;
  const R = 0.30;
  const free = (x,y)=> at((x-R)|0,(y-R)|0)===0 && at((x+R)|0,(y-R)|0)===0 &&
                       at((x-R)|0,(y+R)|0)===0 && at((x+R)|0,(y+R)|0)===0;
  const steps = Math.max(1, Math.ceil(spd/0.10));
  for(let i=0;i<steps;i++){
    const sx = dx*spd/steps, sy = dy*spd/steps;
    if(free(enemy.x+sx, enemy.y+sy)){ enemy.x+=sx; enemy.y+=sy; }
    else if(free(enemy.x+sx, enemy.y)){ enemy.x+=sx; }
    else if(free(enemy.x, enemy.y+sy)){ enemy.y+=sy; }
    else break;
  }
}

const EYE=0.55;
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;

  let vx=0,vy=0; const c=Math.cos(ang), s=Math.sin(ang);
  if(!paused){
    if(keys.KeyW){vx+=c;vy+=s;} if(keys.KeyS){vx-=c;vy-=s;}
    if(keys.KeyA){vx+=s;vy-=c;} if(keys.KeyD){vx-=s;vy+=c;}
  }
  const wantsRun = !paused && (keys.ShiftLeft||keys.ShiftRight);
  const hastens = vx!==0||vy!==0;

  // --- stamina: bieg zużywa, po wyczerpaniu blokada do 1/4 paska ---
  let running = false;
  if(wantsRun && hastens && !exhausted){
    running = true;
    stamina = Math.max(0, stamina - STAM_DRAIN*dt);
    if(stamina <= 0.0001){ stamina = 0; exhausted = true; }
  } else {
    stamina = Math.min(1, stamina + STAM_REGEN*dt);
    if(exhausted && stamina >= STAM_RECOVER) exhausted = false;
  }
  const speed = (paused?0:(running?4.4:2.3))*dt;
  const moving = hastens;

  if(moving){
    bobT += dt*(running?11:7);
    const l=Math.hypot(vx,vy);
    movePlayer(vx/l*speed, vy/l*speed);
  }
  // gdyby gracz znalazł się w ścianie — wysuń go BARDZO krótkimi krokami (bez przechodzenia przez ściany)
  if(!canStand(pX,pY)){
    let fixed = false;
    for(let rr=0.05; rr<=0.60 && !fixed; rr+=0.05){
      for(let a=0;a<16;a++){
        const ax=Math.cos(a*0.392699)*rr, ay=Math.sin(a*0.392699)*rr;
        if(canStand(pX+ax,pY+ay)){ pX+=ax; pY+=ay; fixed=true; break; }
      }
    }
    if(!fixed){ pX = spawn.x; pY = spawn.y; }   // ostateczność: wróć na start
  }
  playerPos.x = pX; playerPos.y = pY;
  // pasek staminy
  stamFill.style.width = (stamina*100).toFixed(1)+'%';
  stamWrap.classList.toggle('empty', exhausted);

  // ===== SHREK: pościg i złapanie =====
  if(!paused && !caught && !won){
    moveEnemy(dt);
    if(enemy){
      const d = Math.hypot(enemy.x-pX, enemy.y-pY);
      if(d < 0.55){ caught = true; caughtEl.style.display='flex'; }
    }
  }
  if(caught || won){ /* nic — koniec gry */ }

  const eye = EYE + groundAt(pX,pY) + Math.sin(bobT)*0.012*(moving?1:0);
  // ===== WYGRANA: wejście na szczyt schodów =====
  {
    const g = groundAt(pX,pY);
    if(!won && g >= TOP_H - 0.02){ won = true; winEl.style.display='flex'; }
    else if(won && g < TOP_H - 0.10){ won = false; winEl.style.display='none'; }
  }
  const tNow = paused ? frozenT : now/1000;
  // --- świat: generowanie kolejnych fragmentów wokół gracza ---
  if(!paused && ensureWorld(pX,pY)) uploadWorldDirty();
  gl.useProgram(prog);                            // uniformy scenerii
  gl.uniform2f(U.uRes, cv.width, cv.height);
  gl.uniform2f(U.uPos, pX, pY);
  gl.uniform2f(U.uDir, Math.cos(ang), Math.sin(ang));
  gl.uniform1f(U.uTime, tNow);
  gl.uniform1f(U.uPitch, -pitch*0.55);
  gl.uniform1f(U.uEye, eye);
  // Shrek — pozycja dla shadera
  if(enemy && !caught){
    gl.uniform1f(U.uHasEnemy, 1.0);
    gl.uniform3f(U.uEnemy, enemy.x, 0.0, enemy.y);
  } else {
    gl.uniform1f(U.uHasEnemy, 0.0);
  }

  // --- przebieg 1: scena do bufora ---
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.viewport(0,0,cv.width,cv.height);
  gl.drawArrays(gl.TRIANGLES,0,3);

  // --- przebieg 2: efekt VHS na ekran ---
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.useProgram(progPost);
  gl.activeTexture(gl.TEXTURE0+4);
  gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.uniform1i(UP.uScene, 4);
  gl.uniform2f(UP.uRes, cv.width, cv.height);
  gl.uniform1f(UP.uTime, tNow);
  gl.drawArrays(gl.TRIANGLES,0,3);

  // (flicker usunięty — światła nie migają)

  // ===== STRZAŁKI DO SCHODÓW (pojawiają się co jakiś czas) =====
  {
    let nearS = null, nd2 = 1e18;
    for(const s of stairsList){
      const d2 = (s.x-pX)*(s.x-pX) + (s.y-pY)*(s.y-pY);
      if(d2 < nd2){ nd2 = d2; nearS = s; }
    }
    const phase = (now/1000) % 16;              // cykl 16 s
    const show = nearS && nd2 < 95*95 && phase < 4.5;
    if(show){
      const dx = nearS.x-pX, dz = nearS.y-pY;
      const ux = dx/(Math.hypot(dx,dz)||1), uz = dz/(Math.hypot(dx,dz)||1);
      // osie ekranu: prawo = (-sin, cos), przód = (cos, sin)
      const sxr = ux*(-Math.sin(ang)) + uz*(Math.cos(ang));
      const syd = -(ux*Math.cos(ang) + uz*Math.sin(ang));
      const deg = Math.atan2(syd, sxr)*180/Math.PI + 90;
      arrowEl.style.display='block';
      arrowEl.style.transform = 'translate(-50%,-50%) rotate('+deg.toFixed(1)+'deg)';
      arrowEl.style.opacity = (phase < 0.4 ? phase/0.4 : (phase > 4.1 ? (4.5-phase)/0.4 : 1)).toFixed(2);
    } else {
      arrowEl.style.opacity = 0;
      if(arrowEl.style.display!=='none' && !arrowEl.style.opacity) arrowEl.style.display='none';
    }
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
}
</script>
