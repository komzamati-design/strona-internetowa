<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Łap Krowę albo Siusiaka! 🐄🌭</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    overflow: hidden;
    transition: background .5s;
  }
  body.cow-mode { background: linear-gradient(180deg, #8fd14f 0%, #4a8f29 100%); }
  body.siusiak-mode { background: linear-gradient(180deg, #ffd6e8 0%, #ff9ec4 100%); }
  header {
    background: rgba(255,255,255,.9);
    width: 100%;
    text-align: center;
    padding: 1rem;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  h1 { transition: color .3s; }
  body.cow-mode h1 { color: #2e7d32; }
  body.siusiak-mode h1 { color: #d81b60; }
  .mode-switch { margin-top: .5rem; display: flex; gap: .8rem; justify-content: center; }
  .mode-btn {
    font-size: 1rem;
    padding: .5rem 1.2rem;
    border: 2px solid transparent;
    border-radius: 50px;
    background: #eee;
    cursor: pointer;
    transition: all .2s;
  }
  .mode-btn.active.cow { background: #2e7d32; color: #fff; }
  .mode-btn.active.siusiak { background: #d81b60; color: #fff; }
  .hud { margin-top: .5rem; font-size: 1.2rem; font-weight: bold; display: flex; gap: 2rem; justify-content: center; }
  #board {
    position: relative;
    flex: 1;
    width: 100%;
    max-width: 700px;
  }
  .animal {
    position: absolute;
    font-size: 3rem;
    cursor: pointer;
    transition: transform .05s;
    filter: drop-shadow(2px 3px 3px rgba(0,0,0,.25));
  }
  .animal.wiggle { animation: wiggle 1s ease-in-out infinite; }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-10deg); }
    50% { transform: rotate(10deg); }
  }
  .animal:active { transform: scale(1.25); }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-align: center;
    z-index: 10;
  }
  #overlay h2 { font-size: 2.5rem; margin-bottom: 1rem; }
  #overlay button {
    font-size: 1.3rem;
    padding: 1rem 2.5rem;
    border: none;
    border-radius: 50px;
    color: #fff;
    cursor: pointer;
    margin-top: 1rem;
  }
  body.cow-mode #overlay button { background: #2e7d32; }
  body.cow-mode #overlay button:hover { background: #1b5e20; }
  body.siusiak-mode #overlay button { background: #d81b60; }
  body.siusiak-mode #overlay button:hover { background: #ad1457; }
  #overlay button:hover { transform: scale(1.05); }
  .hidden { display: none !important; }
  .popup {
    position: fixed;
    font-size: 1.5rem;
    font-weight: bold;
    color: #fff;
    text-shadow: 1px 1px 3px #000;
    pointer-events: none;
    animation: rise .8s ease-out forwards;
    z-index: 5;
  }
  @keyframes rise {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-60px); }
  }
</style>
</head>
<body class="cow-mode">

<header>
  <h1 id="title">🎮 Łap Krowę!</h1>
  <div class="mode-switch">
    <button class="mode-btn cow active" id="cowBtn">🐄 Krowy</button>
    <button class="mode-btn siusiak" id="siusiakBtn">🌭 Siusiaki</button>
  </div>
  <div class="hud">
    <span>Wynik: <span id="score">0</span></span>
    <span>⏱ <span id="time">30</span>s</span>
    <span>Rekord: <span id="best">0</span></span>
  </div>
</header>

<div id="board"></div>

<div id="overlay">
  <h2 id="overlayTitle">🐄 Łap Krowę!</h2>
  <p id="overlayDesc">Klikaj krowy 🐄 (+10 pkt) i mleko 🥛 (+1s czasu).<br>Unikaj wilka 🐺 (-20 pkt i traci rower!).</p>
  <div style="font-size:3rem">↓</div>
  <button id="startBtn">Start!</button>
</div>

<script>
  const board = document.getElementById("board");
  const scoreEl = document.getElementById("score");
  const timeEl = document.getElementById("time");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const titleEl = document.getElementById("title");
  const overlayTitle = document.getElementById("overlayTitle");
  const overlayDesc = document.getElementById("overlayDesc");

  const modes = {
    cow: {
      bestKey: "cowBest",
      title: "🎮 Łap Krowę!",
      overlayTitle: "🐄 Łap Krowę!",
      desc: "Klikaj krowy 🐄 (+10 pkt) i mleko 🥛 (+1s czasu).<br>Unikaj wilka 🐺 (-20 pkt i traci rower!).",
      types: {
        good:   { emoji: "🐄", life: 1400, points: 10 },
        bonus:  { emoji: "🥛", life: 1100, points: 5, timeBonus: 1 },
        bad:    { emoji: "🐺", life: 1600, points: -20 }
      },
      weights: ["good", "good", "good", "bonus", "bad"]
    },
    siusiak: {
      bestKey: "siusiakBest",
      title: "🎮 Łap Siusiaka!",
      overlayTitle: "🌭 Łap Siusiaka!",
      desc: "Klikaj siusiaki 🌭 (+10 pkt) i musztardę 🧴 (+1s czasu).<br>Unikaj bomby 💣 (-20 pkt i bum!).",
      types: {
        good:   { emoji: "🌭", life: 1400, points: 10, wiggle: true },
        bonus:  { emoji: "🧴", life: 1100, points: 5, timeBonus: 1 },
        bad:    { emoji: "💣", life: 1600, points: -20 }
      },
      weights: ["good", "good", "good", "bonus", "bad"]
    }
  };

  let mode = "cow";
  let score = 0, time = 30, playing = false;
  let best = 0;
  let spawnLoop, timeLoop;

  function loadBest() {
    best = +(localStorage.getItem(modes[mode].bestKey) || 0);
    bestEl.textContent = best;
  }

  function setMode(m) {
    mode = m;
    document.body.className = m + "-mode";
    document.getElementById("cowBtn").classList.toggle("active", m === "cow");
    document.getElementById("siusiakBtn").classList.toggle("active", m === "siusiak");
    const cfg = modes[m];
    titleEl.textContent = cfg.title;
    overlayTitle.textContent = cfg.overlayTitle;
    overlayDesc.innerHTML = cfg.desc;
    if (!playing) {
      board.innerHTML = "";
      overlay.classList.remove("hidden");
      overlay.querySelector("p").textContent = "";
      overlayDesc.innerHTML = cfg.desc;
    }
    loadBest();
  }

  function spawn() {
    const cfg = modes[mode];
    const type = cfg.weights[Math.floor(Math.random() * cfg.weights.length)];
    const t = cfg.types[type];

    const el = document.createElement("div");
    el.className = "animal" + (t.wiggle ? " wiggle" : "");
    el.textContent = t.emoji;
    el.style.left = Math.random() * 85 + 2 + "%";
    el.style.top = Math.random() * 80 + 5 + "%";
    board.appendChild(el);

    const timer = setTimeout(() => el.remove(), t.life);

    el.addEventListener("click", () => {
      if (!playing) return;
      clearTimeout(timer);
      el.remove();
      score = Math.max(0, score + t.points);
      scoreEl.textContent = score;
      if (t.timeBonus) time = Math.min(60, time + t.timeBonus);
      popup(el.style.left, el.style.top, (t.points > 0 ? "+" : "") + t.points);
      if (t.points < 0) navigator.vibrate && navigator.vibrate(100);
    });
  }

  function popup(left, top, text) {
    const p = document.createElement("div");
    p.className = "popup";
    p.textContent = text;
    p.style.left = left;
    p.style.top = top;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }

  function start() {
    score = 0; time = 30; playing = true;
    scoreEl.textContent = 0;
    overlay.classList.add("hidden");
    board.innerHTML = "";

    timeLoop = setInterval(() => {
      time--;
      timeEl.textContent = time;
      if (time <= 0) end();
    }, 1000);

    spawnLoop = setInterval(() => {
      spawn();
      if (score > 50) spawn(); // trudniej!
    }, 800);
  }

  function end() {
    playing = false;
    clearInterval(spawnLoop);
    clearInterval(timeLoop);
    board.innerHTML = "";
    if (score > best) {
      best = score;
      localStorage.setItem(modes[mode].bestKey, best);
      bestEl.textContent = best;
      overlayDesc.textContent = "🏆 NOWY REKORD! Wynik: " + score;
    } else {
      overlayDesc.textContent = "Wynik: " + score + " (rekord: " + best + ")";
    }
    overlay.classList.remove("hidden");
  }

  document.getElementById("cowBtn").addEventListener("click", () => { if (!playing) setMode("cow"); });
  document.getElementById("siusiakBtn").addEventListener("click", () => { if (!playing) setMode("siusiak"); });
  document.getElementById("startBtn").addEventListener("click", start);

  loadBest();
</script>

</body>
</html>
